services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/event_booking
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: 51e0b7bac2be0de9e86b90f3a41525b7e12803c91b244c8669bc000ad815b4e0
      ALGORITHM: HS256
    depends_on:
      - db
      - redis

  flower:
    image: mher/flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/event_booking
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: 51e0b7bac2be0de9e86b90f3a41525b7e12803c91b244c8669bc000ad815b4e0
      ALGORITHM: HS256
    depends_on:
      - db
      - redis

volumes:
  postgres_data: